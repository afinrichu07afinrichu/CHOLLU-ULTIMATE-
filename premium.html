<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOLLU Premium</title><meta name="robots" content="noindex,nofollow"><style>body{font:16px system-ui;max-width:650px;margin:auto;padding:20px;background:#151020;color:#fff}.card{padding:20px;border-radius:18px;background:#29203e}button{padding:13px;background:#8b5cf6;color:white;border:0;border-radius:12px;width:100%;font:inherit}a{color:#c4b5fd}.muted{opacity:.7}</style></head><body><h1>⭐ CHOLLU Premium</h1><p><a href="/">← ചാറ്റിലേക്ക്</a></p><div class="card"><h2>Premium Plan</h2><p>കൂടുതൽ സൗകര്യങ്ങൾക്കായുള്ള subscription ഘടന.</p><p class="muted">പണമടയ്ക്കൽ ഇപ്പോൾ സജീവമാക്കരുത്. Stripe webhook verification, subscription entitlement, cancellation/refund flows എന്നിവ പൂർത്തിയായിട്ടില്ല.</p><button onclick="checkout()">Premium checkout പരിശോധിക്കുക</button><p id="msg"></p></div><script>async function checkout(){const t=localStorage.getItem('tk');if(!t){location.href='/';return}const r=await fetch('/api/premium-checkout',{method:'POST',headers:{authorization:'Bearer '+t,'content-type':'application/json'},body:'{}'}).then(x=>x.json());if(r.url)location.href=r.url;else document.querySelector('#msg').textContent=r.error||'Stripe setup ആവശ്യമാണ്.'}</script><p id="ps" class="muted"></p><button id="pm" style="display:none;margin-top:10px" onclick="portal()">Subscription നിയന്ത്രിക്കുക</button><script>(async()=>{const t=localStorage.getItem('tk');if(!t)return;const r=await(await fetch('/api/premium-status',{headers:{authorization:'Bearer '+t}})).json();document.getElementById('ps').textContent=r.premium?'✅ Premium സജീവമാണ്':'Premium ഇല്ല';if(r.status&&r.status!='none')document.getElementById('pm').style.display='block'})();
async function portal(){const t=localStorage.getItem('tk');const r=await(await fetch('/api/premium-portal',{method:'POST',headers:{authorization:'Bearer '+t,'content-type':'application/json'},body:'{}'})).json();r.url?location.href=r.url:alert(r.error)}</script></body></html>
