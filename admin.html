<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOLLU Admin</title><meta name="robots" content="noindex,nofollow"><style>body{font:16px system-ui;max-width:850px;margin:auto;padding:16px;background:#111;color:#eee}.card{background:#222;padding:14px;border-radius:12px;margin:12px 0}button{padding:9px 14px;border:0;border-radius:8px;background:#8b5cf6;color:white}a{color:#c4b5fd}.muted{opacity:.7}</style></head><body><h1>CHOLLU Admin Dashboard</h1><p><a href="/">← ആപ്പിലേക്ക്</a></p><div id="state">അഡ്മിൻ അനുമതി പരിശോധിക്കുന്നു…</div><div id="stats"></div><h2>Reports</h2><div id="reports"></div><h2>Stories/Reels reports</h2><div id="creports"></div><script>const t=localStorage.getItem('tk');const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{authorization:'Bearer '+t,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json()}async function load(){if(!t){document.querySelector('#state').textContent='ലോഗിൻ ചെയ്തിട്ടില്ല.';return}const d=await api('admin');if(d.error){document.querySelector('#state').textContent=d.error+' — ADMIN_USER_IDS ക്രമീകരണം പരിശോധിക്കുക.';return}document.querySelector('#state').textContent='Admin access അനുവദിച്ചു';document.querySelector('#stats').innerHTML=`<div class="card">👤 Users: <b>${d.stats.users}</b> · 💬 Messages: <b>${d.stats.messages}</b></div>`;document.querySelector('#reports').innerHTML=(d.reports||[]).map(x=>`<div class="card"><b>Report #${x.id}</b><p>Report ചെയ്ത user: ${E(x.username||x.by_id)}</p><p>Target user ID: ${x.target}</p><p>${E(x.reason)}</p><p class="muted">${new Date(x.ts).toLocaleString()}</p><button onclick="dismiss(${x.id})">Dismiss report</button></div>`).join('')||'<p class="muted">Reports ഇല്ല.</p>';document.querySelector('#creports').innerHTML=(d.content_reports||[]).map(x=>`<div class="card"><b>${E(x.kind)} #${x.item_id}</b> (user ${x.owner??'—'})<p>${E(x.caption||'')}</p><p>${E(x.reason)}</p>${x.media_url?`<a href="${E(x.media_url)}" target="_blank" rel="noopener">മീഡിയ</a>`:''}<br><button onclick="cact(${x.id},'remove')">Remove content</button> <button onclick="cact(${x.id},'dismiss')">Dismiss</button></div>`).join('')||'<p class="muted">Content reports ഇല്ല.</p>'}async function cact(id,a){if(!confirm(a=='remove'?'ഈ content നീക്കം ചെയ്യണോ?':'Dismiss ചെയ്യണോ?'))return;const r=await api('admin-content-action',{id,action:a});if(r.error)alert(r.error);load()}async function dismiss(id){if(!confirm('ഈ report dismiss ചെയ്യണോ?'))return;const r=await api('admin-report-action',{id});if(r.error)alert(r.error);load()}load();</script></body></html>
