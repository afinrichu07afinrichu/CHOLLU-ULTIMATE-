<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHOLLU – Chat, Groups &amp; AI</title><meta name="description" content="CHOLLU is an animated chat app with private chats, groups, AI assistant, voice and video calling, and customizable themes."><meta name="robots" content="index,follow,max-image-preview:large"><meta property="og:type" content="website"><meta property="og:site_name" content="CHOLLU"><meta property="og:title" content="CHOLLU – Chat, Groups &amp; AI"><meta property="og:description" content="Chat, connect, and customize your CHOLLU experience."><meta property="og:image" content="/icon.svg"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="CHOLLU – Chat, Groups &amp; AI"><meta name="twitter:description" content="Animated chats, groups, AI assistant and customizable themes."><meta name="color-scheme" content="light dark"><link rel="canonical" href="/"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#7c4dff">
<style>
:root{--bg:#fbfaff;--fg:#1b1530;--card:#fff;--line:#e6e0f7;--p:#7c4dff;--in:#fff;--g:none}
html[data-d="1"]{--bg:#120f1d;--fg:#f2eeff;--card:#1d1830;--line:#2e2748;--in:#2a2342}
*{box-sizing:border-box;margin:0}body{font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);height:100dvh;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:auto;background:var(--bg)}
button{font:inherit;background:none;border:0;color:inherit;padding:8px;cursor:pointer}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;outline:0;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--p)}
.btn{background:var(--p);color:#fff;border-radius:12px;padding:12px;width:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.rb{background:linear-gradient(90deg,#ff3d6e,#ffb300,#2ee86b,#1ec8ff,#7c4dff,#ff3d6e);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rb 4s linear infinite;font-weight:900}
@keyframes rb{to{background-position:300% 0}}
.logo{font-size:110px;line-height:1.1;filter:drop-shadow(0 0 16px #b57cff)}.lg{font-size:28px}
.auth{margin:auto;width:min(340px,90%);display:flex;flex-direction:column;gap:10px;text-align:center}.auth a{color:var(--p);cursor:pointer}#err{color:#e5384f;min-height:20px}
#sp{position:fixed;inset:0;background:#120f1d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;animation:fo .5s 1.3s forwards;pointer-events:none}@keyframes fo{to{opacity:0;visibility:hidden}}
#sp .logo{animation:rb 2s linear infinite,pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.12)}}
.tabs{display:flex}.tabs button{flex:1;border-bottom:2px solid transparent}.tabs .on{border-color:var(--p);color:var(--p)}
#sr{margin:8px 12px;width:calc(100% - 24px)}#list{flex:1;overflow:auto}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.row .t{flex:1;min-width:0}.row small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:22px;color:#fff;flex:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--p),inset -4px -6px 10px #0004,inset 3px 3px 8px #fff6}
.bd{background:var(--p);color:#fff;border-radius:99px;padding:1px 8px;font-size:13px}.empty{padding:30px;text-align:center;opacity:.6}
.who{display:flex;gap:10px;align-items:center;flex:1}.who .av{width:36px;height:36px;font-size:18px}.who small{display:block;opacity:.7;font-size:12px}
.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column}
.bg{background:var(--g);background-size:300% 300%;animation:mv 16s ease infinite}@keyframes mv{50%{background-position:100% 100%}}
.t-rainbow{--g:linear-gradient(120deg,rgba(255,99,132,.28),rgba(255,206,86,.28),rgba(75,192,120,.28),rgba(54,162,235,.28),rgba(153,102,255,.28))}
.t-sky{--g:linear-gradient(160deg,rgba(135,206,250,.45),rgba(255,255,255,.15),rgba(135,206,250,.45))}
.t-galaxy{--g:linear-gradient(135deg,rgba(25,10,70,.75),rgba(110,40,160,.55),rgba(10,10,50,.75))}
.t-ocean{--g:linear-gradient(160deg,rgba(0,150,200,.4),rgba(0,60,120,.4),rgba(0,200,180,.35))}
.t-rain{--g:linear-gradient(180deg,rgba(90,110,130,.5),rgba(40,55,70,.5))}
.t-sunset{--g:linear-gradient(160deg,rgba(255,120,60,.4),rgba(255,70,130,.35),rgba(120,60,180,.4))}
.m{max-width:80%;padding:8px 11px;border-radius:16px 16px 16px 4px;margin:3px 0;background:var(--in);align-self:flex-start;word-wrap:break-word;animation:pop .25s;position:relative;color:var(--fg)}
.m.me{align-self:flex-end;background:var(--p);color:#fff;border-radius:16px 16px 4px 16px}@keyframes pop{from{transform:scale(.85);opacity:0}}
.m img,.m video{max-width:100%;border-radius:10px;display:block}.m audio{max-width:220px}.m small{display:block;text-align:right;font-size:11px;opacity:.7;margin-top:2px}
.q{border-left:3px solid #fff8;background:#0002;padding:3px 7px;margin-bottom:4px;border-radius:6px;font-size:13px}.rx{position:absolute;bottom:-10px;right:6px;background:var(--card);border-radius:99px;padding:0 5px;font-size:13px;box-shadow:0 1px 3px #0004}
.stk{font-size:56px;line-height:1.1}.m a{color:inherit}
.comp{display:flex;align-items:center;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}.comp input{flex:1}.send{background:var(--p);border-radius:50%;color:#fff;width:42px;height:42px}
#rp{padding:0 12px}#rp div{background:var(--card);border-left:3px solid var(--p);padding:6px 10px;display:flex;justify-content:space-between;font-size:14px}
#sh{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:50}#sh>div{background:var(--card);width:100%;max-width:720px;margin:auto;padding:16px;border-radius:20px 20px 0 0;display:flex;flex-wrap:wrap;gap:6px;max-height:75vh;overflow:auto;align-items:center}
#sh>div>*{flex:none}#sh .f{flex:1 0 100%;display:flex;flex-direction:column;gap:8px}.rr button{font-size:28px}.eg button{font-size:26px;padding:6px}
.fh{position:fixed;bottom:90px;font-size:30px;animation:fl 1.8s forwards;pointer-events:none;z-index:60}@keyframes fl{to{transform:translateY(-320px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="sp"><div class="rb logo">?</div><div class="rb" style="font-size:30px;letter-spacing:4px">CHOLLU</div></div><div id="app"></div>
<script>
let T,P=null,M=[],R={},last=0,seen=0,sig='',qf='',RP=0,tab='all',PM={},cnt=0,ci=0,found=0,unl={},tt=0,mr,ch=[];
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls=k=>localStorage.getItem(k),ss=(k,v)=>v==null?localStorage.removeItem(k):localStorage.setItem(k,v);
let tk=ls('tk'),me=JSON.parse(ls('me')||'null');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('chollu'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
async function api(p,b){try{const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{authorization:'Bearer '+tk,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});
if(r.status==401&&!/login|signup/.test(p)){logout();return{}}return await r.json()}catch(e){return{error:'നെറ്റ്‌വർക്ക് പിശക്'}}}
const av=u=>`<i class="av" style="background:hsl(${[...u.username].reduce((a,c)=>a+c.charCodeAt(0)*37,0)%360},65%,50%)">${E(u.avatar||u.username[0].toUpperCase())}</i>`;
const sheet=h=>{$('#sh')?.remove();document.body.insertAdjacentHTML('beforeend',`<div id="sh" onclick="if(event.target==this)this.remove()"><div>${h}</div></div>`)};
const close=()=>$('#sh')?.remove();
function beep(){try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=+ls('snd')||880;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);o.start();o.stop(a.currentTime+.25)}catch{}}
function hearts(){for(let i=0;i<7;i++){const s=document.createElement('span');s.className='fh';s.textContent='❤️';s.style.left=10+Math.random()*80+'%';s.style.animationDelay=i*.12+'s';document.body.append(s);setTimeout(()=>s.remove(),2500)}}
function mode(){const d=document.documentElement.dataset.d=='1'?'0':'1';document.documentElement.dataset.d=d;ss('d',d)}
function auth(m='login'){clearInterval(T);$('#app').innerHTML=`<div class="auth"><div class="rb logo">?</div><h2 class="rb">CHOLLU</h2><input id="u" placeholder="Username" autocapitalize="off" autocomplete="username">${m=='signup'?'<input id="em" type="email" placeholder="ഇമെയിൽ (password reset-ന്)" autocomplete="email">':''}<input id="p" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key=='Enter')go('${m}')"><button class="btn" onclick="go('${m}')">${m=='login'?'ലോഗിൻ':'അക്കൗണ്ട് ഉണ്ടാക്കുക'}</button><div id="err"></div>${m=='login'?'<a onclick="forgot()">പാസ്‌വേഡ് മറന്നോ?</a>':''}<a onclick="auth('${m=='login'?'signup':'login'}')">${m=='login'?'പുതിയ അക്കൗണ്ട്? Sign up':'അക്കൗണ്ട് ഉണ്ടോ? Login'}</a></div>`}
async function go(m){const r=await api(m,{username:$('#u').value.trim(),password:$('#p').value,email:$('#em')?.value.trim()});if(r.error)return $('#err').textContent=r.error;tk=r.token;me=r.user;ss('tk',tk);ss('me',JSON.stringify(me));home()}
function logout(){if(tk)fetch('/api/logout',{method:'POST',headers:{authorization:'Bearer '+tk}}).catch(()=>{});ss('tk');ss('me');tk=null;me=null;auth()}
function home(){clearInterval(T);registerDevice();P=null;found=0;$('#app').innerHTML=`<header><span class="rb lg">CHOLLU</span><span><button onclick="newG()" aria-label="New group">👥</button><button onclick="location.href='/social.html'" aria-label="Stories and reels">🎬</button><button onclick="location.href='/premium.html'" aria-label="Premium">⭐</button><button onclick="mode()" aria-label="Dark mode">🌓</button><button onclick="prof()" aria-label="Profile">${av(me)}</button></span></header><div class="tabs"><button class="${tab=='all'?'on':''}" onclick="tab='all';home()">ചാറ്റുകൾ</button><button class="${tab=='lock'?'on':''}" onclick="tab='lock';home()">🔒 Locked</button></div><input id="sr" placeholder="Username തിരയുക…" oninput="find(this.value)"><div id="list"></div>`;load();enablePush();T=setInterval(load,4000)}
const row=c=>{PM[c.id]=c;return `<div class="row" onclick="op(${c.id})">${av(c)}<div class="t"><b>${E(c.username)}</b>${ls('pin:'+c.id)?' 📌':''}${ls('mute:'+c.id)?' 🔇':''}<small>${c.kind&&c.kind!='text'?{image:'📷 ഫോട്ടോ',video:'🎬 വീഡിയോ',audio:'🎤 വോയ്‌സ്',file:'📄 ഫയൽ',sticker:'🙂 സ്റ്റിക്കർ'}[c.kind]:E(c.body||c.status||'')}</small></div>${c.unread?`<span class="bd">${c.unread}</span>`:''}${c.kind!==undefined?`<button onclick="event.stopPropagation();tg('pin',${c.id})">📌</button><button onclick="event.stopPropagation();tg('mute',${c.id})">🔇</button>`:''}</div>`};
function tg(k,id){ls(k+':'+id)?ss(k+':'+id):ss(k+':'+id,1);load()}
async function load(){const r=await api('chats');if(!r.chats||found||!$('#list'))return;let n=0;
r.chats.forEach(c=>{if(!ls('mute:'+c.id))n+=c.unread});if(ci&&n>cnt){beep();nt('CHOLLU','പുതിയ സന്ദേശം')}document.title=(n?'('+n+') ':'')+'CHOLLU';cnt=n;ci=1;
const l=r.chats.filter(c=>!!ls('lock:'+c.id)==(tab=='lock')&&!ls('blk:'+c.id)).sort((a,b)=>!!ls('pin:'+b.id)-!!ls('pin:'+a.id));
$('#list').innerHTML=l.map(row).join('')||'<p class="empty">ചാറ്റുകൾ ഇല്ല. മുകളിൽ username തിരഞ്ഞ് തുടങ്ങൂ.</p>'}
async function find(q){q=q.trim();found=!!q;if(!q)return load();const r=await api('users?q='+encodeURIComponent(q));if(found)$('#list').innerHTML=(r.users||[]).filter(u=>!ls('blk:'+u.id)).map(row).join('')||'<p class="empty">ആരെയും കണ്ടില്ല</p>'}
async function op(id){P=PM[id];const h=ls('lock:'+id);if(h&&!unl[id]){let ok=0;if(ls('fp:'+id))ok=await fpAsk(id);
if(!ok){const pt=h.startsWith('p:'),x=pt?await pad('🔒 Pattern വരയ്ക്കുക'):prompt('🔒 PIN നൽകുക');if(!x||(pt?'p:':'')+await sha(x)!=h)return alert('തെറ്റായ PIN / Pattern')}}unl[id]=1;chat()}
function chat(){clearInterval(T);M=[];R={};last=0;seen=0;sig='';qf='';RP=0;const th=ls('th:'+P.id)||'rainbow';
$('#app').innerHTML=`<header><button onclick="home()" aria-label="Back">←</button><div class="who">${av(P)}<div><b>${E(P.username)}</b><small id="st"></small></div></div>${P.grp||P.username=='chollu_ai'?'':'<button onclick="startCall(false)" aria-label="Voice call">📞</button><button onclick="startCall(true)" aria-label="Video call">🎥</button>'}<button onclick="menu()" aria-label="Menu">⋮</button></header><div id="ms" class="msgs bg t-${th}"></div><div id="rp"></div><div class="comp"><button onclick="emo()">😊</button><button onclick="$('#fi').click()">📎</button><input id="mi" placeholder="സന്ദേശം…" oninput="typing()" onkeydown="if(event.key=='Enter')sendT()"><button id="mk" onclick="rec()">🎤</button><button class="send" onclick="sendT()">➤</button></div><input id="fi" type="file" hidden onchange="file(this)">`;poll();T=setInterval(poll,2000)}
async function poll(){if(!P)return;const r=await api('messages?with='+P.id+'&after='+last);if(!r.m||!$('#ms'))return;
const n0=M.length;M=M.filter(m=>!(m.exp&&m.exp<Date.now()));if(M.length!=n0)sig='';const nw=r.m.filter(m=>!M.find(x=>x.id==m.id));nw.forEach(m=>M.push(m));r.m.forEach(m=>last=Math.max(last,m.id));
if(ci&&nw.some(m=>m.from_id==P.id)&&!ls('mute:'+P.id)){beep();nt(P.username,'പുതിയ സന്ദേശം')}
M.forEach(m=>{if(r.del.includes(m.id))m.deleted=1});r.ed.forEach(e=>{const m=M.find(x=>x.id==e.id);if(m){m.body=e.body;m.edited=1}});R={};r.re.forEach(x=>(R[x.msg_id]=R[x.msg_id]||[]).push(x));seen=r.seen;
$('#st').textContent=r.peer.typing?'ടൈപ്പ് ചെയ്യുന്നു…':r.peer.online?'ഓൺലൈൻ':'ഓഫ്‌ലൈൻ';
GN=r.names||{};if(P.grp)$('#st').textContent='👥 '+Object.keys(GN).length+' അംഗങ്ങൾ';if(r.ttl)$('#st').textContent+=' · ⏳ '+TL(r.ttl);TTL=r.ttl||0;const s=JSON.stringify([r.del,r.re,r.seen,r.ttl,r.ed]);if(nw.length||s!=sig){sig=s;draw()}}
function bub(m){const mine=m.from_id==me.id;let c;
if(m.deleted)c='<i>🚫 സന്ദേശം ഡിലീറ്റ് ചെയ്തു</i>';else{
c=m.kind=='image'?`<img src="${m.body}" onclick="event.stopPropagation();zoom(this.src)">`:m.kind=='video'?`<video controls src="${m.body}"></video>`:m.kind=='audio'?`<audio controls src="${m.body}"></audio>`:m.kind=='sticker'?`<span class="stk">${E(m.body)}</span>`:m.kind=='file'&&m.body.startsWith('r2file:')?`<button onclick="event.stopPropagation();downloadR2('${m.body.slice(7)}')">⬇️ സുരക്ഷിത ഫയൽ ഡൗൺലോഡ്</button>`:m.kind=='file'?`<a download="${E(m.body.split('|')[0])}" href="${m.body.slice(m.body.indexOf('|')+1)}">📄 ${E(m.body.split('|')[0])}</a>`:E(m.body);
const q=m.reply_to&&M.find(x=>x.id==m.reply_to);if(q)c=`<div class="q">${q.kind=='text'&&!q.deleted?E(q.body.slice(0,60)):'മീഡിയ'}</div>`+c}
const rx=(R[m.id]||[]).map(x=>x.emoji).join('');
return `<div class="m ${mine?'me':''}" onclick="act(${m.id})">${P.grp&&!mine?`<small style="text-align:left;font-weight:700;opacity:.8">${E(GN[m.from_id]||'')}</small>`:''}${c}<small>${m.edited?'തിരുത്തി · ':''}${m.exp?'⏳ ':''}${new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}${mine?(m.id<=seen?' ✓✓':' ✓'):''}</small>${rx?`<span class="rx">${rx}</span>`:''}</div>`}
function draw(){const el=$('#ms'),nb=el.scrollHeight-el.scrollTop-el.clientHeight<150;
el.innerHTML=M.filter(m=>!ls('hm:'+m.id)).filter(m=>!qf||(m.kind=='text'&&m.body.toLowerCase().includes(qf))).map(bub).join('');if(nb)el.scrollTop=el.scrollHeight}
function act(id){const m=M.find(x=>x.id==id);if(m.deleted)return;sheet(`<div class="rr">${['❤️','😂','👍','😮','😢','🔥'].map(e=>`<button onclick="react(${id},'${e}')">${e}</button>`).join('')}</div>${m.from_id==me.id&&m.kind=='text'?`<button onclick="edt(${id})">✏️ തിരുത്തുക</button>`:''}<button onclick="hide(${id})">🙈 എനിക്ക് മാത്രം ഒഴിവാക്കുക</button><button onclick="rep(${id})">↩️ മറുപടി</button>${m.from_id==me.id?`<button onclick="del(${id})">🗑️ എല്ലാവർക്കും ഡിലീറ്റ്</button>`:''}`)}
async function react(id,e){close();if(e=='❤️')hearts();await api('react',{id,emoji:e});poll()}
function rep(id){close();RP=id;const m=M.find(x=>x.id==id);$('#rp').innerHTML=`<div><span>↩️ ${m.kind=='text'?E(m.body.slice(0,50)):'മീഡിയ'}</span><button onclick="RP=0;$('#rp').innerHTML=''">✕</button></div>`;$('#mi').focus()}
async function del(id){close();await api('delete',{id});poll()}
async function send(kind,body){const r=await api('send',{to:P.id,kind,body,reply_to:RP});if(r.error)return alert(r.error);RP=0;$('#rp').innerHTML='';$('#mi').value='';await poll();const e=$('#ms');e.scrollTop=e.scrollHeight}
function sendT(){const v=$('#mi').value.trim();if(v)send('text',v)}
function typing(){if(Date.now()-tt>3000){tt=Date.now();api('typing',{to:P.id})}}
function emo(){const E1='😀😂🥰😍😎🤔😢😡👍🙏👏🔥🎉💯❤️💔🌈⭐🌸🍕☕⚽🎶😴🤯😅🥳😇🤝💪'.match(/\p{Extended_Pictographic}\uFE0F?/gu);
sheet(`<div class="f eg" style="flex-direction:row;flex-wrap:wrap">${E1.map(e=>`<button onclick="$('#mi').value+='${e}'">${e}</button>`).join('')}</div><b class="f">സ്റ്റിക്കറുകൾ</b><div class="f" style="flex-direction:row;flex-wrap:wrap">${['🌈','🦄','🐼','🥳','😻','🎈','🍉','🚀'].map(e=>`<button style="font-size:40px" onclick="close();send('sticker','${e}')">${e}</button>`).join('')}</div>`)}
async function shrink(f){const i=new Image();i.src=await rd(f);await i.decode();const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7)}
async function file(inp){const f=inp.files[0];inp.value='';if(!f)return;if(f.size>4*1024*1024*1024)return alert('4GB-ൽ കൂടുതൽ ഫയൽ അയയ്ക്കാൻ കഴിയില്ല');if(f.type.startsWith('image/')&&f.size<600000)return send('image',await shrink(f));await uploadR2(f)}

async function onSig(s){const d=JSON.parse(s.data||'{}'),f=s.from_id;
if(s.kind=='invite'){if(cs||INV)return sg(f,'end');INV={from:f,name:s.username,video:d.video};ringT=setInterval(beep,1500);beep();sheet(`<b class="f">${d.video?'🎥':'📞'} ${E(s.username)} വിളിക്കുന്നു</b><button class="btn" style="background:#2e9e5b" onclick="acc()">ഉത്തരം നൽകുക</button><button class="btn" style="background:#e5384f" onclick="dec()">നിരസിക്കുക</button>`);return}
if(s.kind=='end'){if(INV&&INV.from==f){INV=null;clearInterval(ringT);close()}if(cs&&cs.peer.id==f)endCall(1);return}

if(s.kind=='accept'){cs.on=1;await pc.setLocalDescription(await pc.createOffer());sg(f,'offer',pc.localDescription)}
else if(s.kind=='offer'){await pc.setRemoteDescription(d);await flush();await pc.setLocalDescription(await pc.createAnswer());sg(f,'answer',pc.localDescription)}

else if(s.kind=='ice'){pc.remoteDescription?await pc.addIceCandidate(d):pend.push(d)}}
