<!doctype html><html lang="ml"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHOLLU Social</title><meta name="robots" content="noindex,nofollow"><style>body{font:16px system-ui;max-width:760px;margin:auto;padding:16px;background:#12101b;color:#f7f4ff}button,input{font:inherit;padding:10px;border-radius:10px;border:1px solid #51456e;margin:4px;background:#241d35;color:inherit;width:100%;box-sizing:border-box}.card{padding:14px;margin:12px 0;background:#241d35;border-radius:14px;overflow-wrap:anywhere}a{color:#bba1ff}.muted{opacity:.7;font-size:13px}.row{display:flex;gap:8px}.row button{width:auto}</style></head><body>
<h1>🎬 CHOLLU Stories & Reels</h1><p><a href="/">← ചാറ്റിലേക്ക് മടങ്ങുക</a></p><section class="card"><h2>Story ചേർക്കുക (24 മണിക്കൂർ)</h2><select id="storyAud"><option value="everyone">എല്ലാവർക്കും</option><option value="contacts">ചാറ്റ് ചെയ്തവർക്ക് മാത്രം</option></select><input id="storyFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime"><input id="storyUrl" placeholder="Public HTTPS image/video URL"><input id="storyCap" maxlength="300" placeholder="Caption"><button onclick="createStory()">Story പ്രസിദ്ധീകരിക്കുക</button><p class="muted">ഫോട്ടോ 10MB, വീഡിയോ 90MB വരെ (ആകെ 500MB). ഫയലിന് പകരം HTTPS URL-ഉം നൽകാം.</p></section>
<section class="card"><h2>Reel ചേർക്കുക</h2><input id="reelFile" type="file" accept="video/mp4,video/webm,video/quicktime"><input id="reelUrl" placeholder="Public HTTPS video URL"><input id="reelCap" maxlength="500" placeholder="Caption"><button onclick="createReel()">Reel പ്രസിദ്ധീകരിക്കുക</button><p class="muted">ഫോട്ടോ 10MB, വീഡിയോ 90MB വരെ (ആകെ 500MB). ഫയലിന് പകരം HTTPS URL-ഉം നൽകാം.</p></section>
<h2>Stories</h2><div id="stories">ലോഡ് ചെയ്യുന്നു…</div><h2>Reels</h2><div id="reels">ലോഡ് ചെയ്യുന്നു…</div>
<script>const token=localStorage.getItem('tk');const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,b){const r=await fetch('/api/'+p,{method:b?'POST':'GET',headers:{authorization:'Bearer '+token,'content-type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status===401){location.href='/';return{}}return r.json()}async function createStory0(){const media_url=document.querySelector('#storyUrl').value.trim(),caption=document.querySelector('#storyCap').value.trim();if(!media_url.startsWith('https://'))return alert('HTTPS URL നൽകുക');const r=await api('stories-create',{media_url,caption,audience:document.querySelector('#storyAud').value});if(r.error)return alert(r.error);document.querySelector('#storyUrl').value='';document.querySelector('#storyCap').value='';load()}async function createReel0(){const media_url=document.querySelector('#reelUrl').value.trim(),caption=document.querySelector('#reelCap').value.trim();if(!media_url.startsWith('https://'))return alert('HTTPS URL നൽകുക');const r=await api('reel-create',{media_url,caption});if(r.error)return alert(r.error);document.querySelector('#reelUrl').value='';document.querySelector('#reelCap').value='';load()}async function load0(){if(!token){location.href='/';return}const s=await api('stories'),r=await api('reels');window.ST=s.stories||[];document.querySelector('#stories').innerHTML=(s.stories||[]).map(x=>`<article class="card"><b>${E(x.avatar)} ${E(x.username)}</b><p>${E(x.caption)}</p>${med(x)}<button onclick="rep('story',${x.id})">🚩 Report</button>${x.uid==ME?`<button onclick="delItem('story',${x.id})">🗑️ ഡിലീറ്റ്</button>`:''}${x.uid==ME?`<p class="muted">👁 ${x.vc||0} പേർ കണ്ടു</p>`:''}<p class="muted">അവസാനിക്കുന്നത്: ${new Date(x.expires).toLocaleString()}</p></article>`).join('')||'<p class="muted">Stories ഇല്ല.</p>';document.querySelector('#reels').innerHTML=(r.reels||[]).map(x=>`<article class="card"><b>${E(x.avatar)} ${E(x.username)}</b><p>${E(x.caption)}</p>${med(x)}<button onclick="rep('reel',${x.id})">🚩 Report</button>${x.uid==ME?`<button onclick="delItem('reel',${x.id})">🗑️ ഡിലീറ്റ്</button>`:''}<div class="row"><button onclick="like(${x.id})">${x.liked?'♥':'♡'} ${x.likes}</button><button onclick="cm(${x.id})">💬 ${x.cc||0}</button></div><div id="cm${x.id}"></div></article>`).join('')||'<p class="muted">Reels ഇല്ല.</p>'}async function like(id){const r=await api('reel-like',{id});if(r.error)alert(r.error);load()}const ME=JSON.parse(localStorage.getItem('me')||'{}').id;
const med=x=>x.mt&&x.mt.startsWith('image/')?`<img src="${E(x.media_url)}" alt="" style="max-width:100%;border-radius:10px">`:x.mt&&x.mt.startsWith('video/')?`<video controls playsinline preload="metadata" src="${E(x.media_url)}" style="max-width:100%;border-radius:10px"></video>`:`<a target="_blank" rel="noopener" href="${E(x.media_url)}">മീഡിയ തുറക്കുക</a>`;
const up=async(f,kind)=>(await fetch('/api/media-upload?kind='+kind,{method:'POST',headers:{authorization:'Bearer '+token,'content-type':f.type},body:f})).json();
async function createStory(){const f=document.querySelector('#storyFile').files[0];if(!f)return createStory0();const u=await up(f,'story');if(u.error)return alert(u.error);const r=await api('stories-create',{media_id:u.media_id,caption:document.querySelector('#storyCap').value.trim(),audience:document.querySelector('#storyAud').value});if(r.error)return alert(r.error);document.querySelector('#storyFile').value='';document.querySelector('#storyCap').value='';load()}
async function createReel(){const f=document.querySelector('#reelFile').files[0];if(!f)return createReel0();const u=await up(f,'reel');if(u.error)return alert(u.error);const r=await api('reel-create',{media_id:u.media_id,caption:document.querySelector('#reelCap').value.trim()});if(r.error)return alert(r.error);document.querySelector('#reelFile').value='';document.querySelector('#reelCap').value='';load()}
async function rep(kind,id){const reason=prompt('Report ചെയ്യാനുള്ള കാരണം');if(!reason)return;const r=await api('content-report',{kind,id,reason});alert(r.error||'Report ലഭിച്ചു. നന്ദി!')}
async function delItem(kind,id){if(confirm('ഡിലീറ്റ് ചെയ്യണോ?')){await api(kind+'-delete',{id});load()}}
let OPEN=0;const SEEN=new Set();
async function load(){await load0();(window.ST||[]).filter(x=>x.uid!=ME&&!SEEN.has(x.id)).forEach(x=>{SEEN.add(x.id);api('story-view',{id:x.id})});if(OPEN)cm(OPEN,true)}
async function cm(id,keep){const d=document.querySelector('#cm'+id);if(!d)return;if(!keep&&OPEN==id){OPEN=0;d.innerHTML='';return}OPEN=id;const r=await api('reel-comments?id='+id);
d.innerHTML=(r.comments||[]).map(c=>`<p><b>${E(c.avatar)} ${E(c.username)}</b> ${E(c.body)} ${c.uid==ME?`<a href="#" onclick="dc(${c.id});return false">🗑️</a>`:''}</p>`).join('')+`<div class="row"><input id="ci${id}" maxlength="500" placeholder="Comment…"><button onclick="sc(${id})">➤</button></div>`}
async function sc(id){const v=document.querySelector('#ci'+id).value.trim();if(!v)return;const r=await api('reel-comment',{id,body:v});if(r.error)return alert(r.error);load()}
async function dc(id){await api('reel-comment-delete',{id});load()}
load();</script></body></html>
